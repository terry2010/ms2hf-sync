name: ms2hf 模型同步

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Sync direction'
        required: true
        default: 'ModelScope → HuggingFace'
        type: choice
        options:
          - 'ModelScope → HuggingFace'
          - 'HuggingFace → ModelScope'
      source_repo:
        description: 'Source repo id (owner/name)'
        required: true
        default: 'terry2010/Huihui-Ornith-1.5-35B-A3B-oQ4e-mtp'
      target_repo:
        description: 'Target repo id (owner/name)'
        required: true
        default: 'terry2010/Ornith-1.5-35B-A3B-abliterated-MLX-oQ4e-mtp'
      repo_type:
        description: 'Repository type'
        required: true
        default: 'model'
        type: choice
        options:
          - model
          - dataset
      mirror:
        description: '镜像删除（危险，默认关闭）：文件同步完成后，删除目标仓库中「源仓库不存在」的文件，使目标与源完全一致。开启前请确认：1) 源仓库是完整的权威版本，否则目标上会误删未同步到的文件；2) 目标仓库里没有手工上传的独有文件（如仅存在于 HF 的 README 修订、LICENSE、.gitattributes），镜像后这些会被清掉。删除在日志中逐条打印可审计，但不可恢复。建议首次使用先不开镜像跑一遍，核对两边文件清单后再开。'
        required: false
        default: false
        type: boolean
      force:
        description: '强制全量（默认关闭，通常不必开）：默认已按 sha256 自动检测变化——缺失/hash 不同的文件才传，未变的跳过。勾选后跳过差异比对，无视目标已有文件整仓重传，仅在想强制刷新全部文件时使用（大仓很慢）。与 mirror 同时勾选 = 完全镜像（全量覆盖 + 多余删除）。'
        required: false
        default: false
        type: boolean

concurrency:
  group: ms2hf-${{ inputs.direction }}-${{ inputs.source_repo }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install ms2hf
        run: pip install ms2hf

      # Content-aware diff: compare sha256 (LFS files carry it on both platforms),
      # size, and presence. Small files without a comparable hash are re-transferred
      # (cheap); large unverifiable same-size files are skipped with a warning.
      - name: Compute file diff
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        run: |
          python - <<'PY'
          import os, re
          from ms2hf import ModelScopeBackend, _hf_repo_type
          from huggingface_hub import HfApi
          from huggingface_hub.hf_api import RepoFile
          from modelscope.hub.api import HubApi

          direction = "${{ inputs.direction }}"
          src_repo = "${{ inputs.source_repo }}"
          dst_repo = "${{ inputs.target_repo }}"
          repo_type = "${{ inputs.repo_type }}"
          ms_to_hf = direction == "ModelScope → HuggingFace"

          def ms_meta(repo_id):
              api = HubApi()
              tok = os.environ.get("MS_TOKEN")
              if tok:
                  api.login(tok)
              if repo_type == "model":
                  out = {}
                  for f in api.get_model_files(model_id=repo_id, recursive=True,
                                               use_cookies=bool(tok)):
                      if f.get("Type") == "tree" or not f.get("Path"):
                          continue
                      out[f["Path"]] = {"sha": (f.get("Sha256") or "").lower() or None,
                                        "size": f.get("Size")}
                  return out
              b = ModelScopeBackend(token=tok)
              return {f.path: {"sha": None, "size": f.size}
                      for f in b.list_files(repo_id, repo_type, None)}

          def hf_meta(repo_id):
              api = HfApi(token=os.environ.get("HF_TOKEN"))
              out = {}
              for e in api.list_repo_tree(repo_id, repo_type=_hf_repo_type(repo_type),
                                          recursive=True):
                  if not isinstance(e, RepoFile):
                      continue
                  out[e.path] = {"sha": e.lfs.sha256.lower() if e.lfs else None,
                                 "size": e.size}
              return out

          src = (ms_meta if ms_to_hf else hf_meta)(src_repo)
          try:
              dst = (hf_meta if ms_to_hf else ms_meta)(dst_repo)
          except Exception as e:
              print(f"target listing failed, treating as empty: {e}")
              dst = {}

          if not src:
              raise SystemExit("source repo listed 0 files - aborting to avoid no-op sync")

          SMALL = 100 * 1024 * 1024  # re-transfer threshold when no hash is comparable
          changed, skipped, unverifiable = [], 0, []
          for p, sm in src.items():
              dm = dst.get(p)
              if dm is None:
                  changed.append((p, "missing")); continue
              if sm["sha"] and dm["sha"]:
                  if sm["sha"] != dm["sha"]:
                      changed.append((p, "sha256 differs"))
                  else:
                      skipped += 1
                  continue
              if sm["size"] is not None and dm["size"] is not None \
                 and int(sm["size"]) != int(dm["size"]):
                  changed.append((p, "size differs")); continue
              sz = int(sm["size"] or dm["size"] or 0)
              if sz < SMALL:
                  changed.append((p, "hash unavailable (small, cheap re-transfer)"))
              else:
                  unverifiable.append(p)

          print(f"diff: {len(src)} source / {len(dst)} target -> "
                f"{len(changed)} to transfer, {skipped} unchanged")
          for p, why in changed:
              print(f"  transfer [{why}]: {p}")
          for p in unverifiable:
              print(f"  SKIP unverifiable same-size, no hash: {p}")

          with open("diff_paths.txt", "w") as f:
              for p, _ in changed:
                  f.write(p + "\n")
          with open("include_patterns.txt", "w") as f:
              for p, _ in changed:
                  f.write("^" + re.escape(p) + "$" + "\n")
          PY

      - name: Sync ${{ inputs.direction }} ${{ inputs.source_repo }} -> ${{ inputs.target_repo }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        # --workers 2 keeps peak disk at ~2x largest file (~10GB) under the ~14GB runner limit
        run: |
          case "${{ inputs.direction }}" in
            "ModelScope → HuggingFace") CMD=ms2hf ;;
            "HuggingFace → ModelScope") CMD=hf2ms ;;
            *) echo "unknown direction: ${{ inputs.direction }}"; exit 1 ;;
          esac
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=on: full re-transfer (diff ignored)"
            $CMD "${{ inputs.source_repo }}" "${{ inputs.target_repo }}" \
              --repo-type "${{ inputs.repo_type }}" --workers 2 --force
          elif [ -s diff_paths.txt ]; then
            mapfile -t ARGS < <(while IFS= read -r p; do \
              [ -n "$p" ] && printf -- "--include-regex\n%s\n" "$p"; done < include_patterns.txt)
            echo "transferring $(wc -l < diff_paths.txt) changed/missing file(s)"
            $CMD "${{ inputs.source_repo }}" "${{ inputs.target_repo }}" \
              --repo-type "${{ inputs.repo_type }}" --workers 2 --force "${ARGS[@]}"
          else
            echo "target already up to date (sha256 verified) - nothing to transfer"
          fi

      # Mirror mode: after syncing, delete files that exist on the target but not
      # on the source. Destructive — only runs when the mirror checkbox is on.
      - name: Mirror deletions (remove files absent from source)
        if: inputs.mirror
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from ms2hf import HuggingFaceBackend, ModelScopeBackend, _hf_repo_type

          direction = "${{ inputs.direction }}"
          src_repo = "${{ inputs.source_repo }}"
          dst_repo = "${{ inputs.target_repo }}"
          repo_type = "${{ inputs.repo_type }}"

          ms_to_hf = direction == "ModelScope → HuggingFace"
          src = ModelScopeBackend(token=os.environ["MS_TOKEN"]) if ms_to_hf \
              else HuggingFaceBackend(token=os.environ["HF_TOKEN"])
          dst = HuggingFaceBackend(token=os.environ["HF_TOKEN"]) if ms_to_hf \
              else ModelScopeBackend(token=os.environ["MS_TOKEN"])

          src_paths = {f.path for f in src.list_files(src_repo, repo_type, None)}
          dst_paths = [f.path for f in dst.list_files(dst_repo, repo_type, None)]
          extra = sorted(set(dst_paths) - src_paths)

          if not extra:
              print("mirror: target matches source, nothing to delete")
          for p in extra:
              print(f"mirror: deleting {p}")
              if ms_to_hf:
                  dst.api.delete_file(path_in_repo=p, repo_id=dst_repo,
                                      repo_type=_hf_repo_type(repo_type), token=dst.token)
              else:
                  dst.api.delete_files(dst_repo, repo_type, p, token=dst.token)
          PY
