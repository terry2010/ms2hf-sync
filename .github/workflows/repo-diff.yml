name: 仓库差异对比

on:
  workflow_dispatch:
    inputs:
      direction:
        description: '对比方向（决定 source/target 各在哪个平台）'
        required: true
        default: 'ModelScope → HuggingFace'
        type: choice
        options:
          - 'ModelScope → HuggingFace'
          - 'HuggingFace → ModelScope'
      source_repo:
        description: 'Source repo id (owner/name)'
        required: true
        default: 'terry2010/Huihui-Ornith-1.5-35B-A3B-oQ4e-mtp'
      target_repo:
        description: 'Target repo id (owner/name)'
        required: true
        default: 'terry2010/Ornith-1.5-35B-A3B-abliterated-MLX-oQ4e-mtp'
      repo_type:
        description: 'Repository type'
        required: true
        default: 'model'
        type: choice
        options:
          - model
          - dataset

concurrency:
  group: repo-diff-${{ inputs.source_repo }}-${{ inputs.target_repo }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install ms2hf

      # Read-only audit: list metadata on both platforms, classify every file as
      # identical / changed / missing / extra / unverifiable, then render a
      # markdown report to the Step Summary (and plain text to the log).
      - name: Compare repositories
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from ms2hf import ModelScopeBackend, _hf_repo_type
          from huggingface_hub import HfApi
          from huggingface_hub.hf_api import RepoFile
          from modelscope.hub.api import HubApi

          direction = "${{ inputs.direction }}"
          src_repo = "${{ inputs.source_repo }}"
          dst_repo = "${{ inputs.target_repo }}"
          repo_type = "${{ inputs.repo_type }}"
          ms_to_hf = direction == "ModelScope → HuggingFace"
          src_name = "ModelScope" if ms_to_hf else "HuggingFace"
          dst_name = "HuggingFace" if ms_to_hf else "ModelScope"

          def ms_meta(repo_id):
              api = HubApi()
              tok = os.environ.get("MS_TOKEN")
              if tok:
                  api.login(tok)
              if repo_type == "model":
                  out = {}
                  for f in api.get_model_files(model_id=repo_id, recursive=True,
                                               use_cookies=bool(tok)):
                      if f.get("Type") == "tree" or not f.get("Path"):
                          continue
                      out[f["Path"]] = {"sha": (f.get("Sha256") or "").lower() or None,
                                        "size": f.get("Size")}
                  return out
              b = ModelScopeBackend(token=tok)
              return {f.path: {"sha": None, "size": f.size}
                      for f in b.list_files(repo_id, repo_type, None)}

          def hf_meta(repo_id):
              api = HfApi(token=os.environ.get("HF_TOKEN"))
              out = {}
              for e in api.list_repo_tree(repo_id, repo_type=_hf_repo_type(repo_type),
                                          recursive=True):
                  if not isinstance(e, RepoFile):
                      continue
                  out[e.path] = {"sha": e.lfs.sha256.lower() if e.lfs else None,
                                 "size": e.size}
              return out

          def meta(platform, repo_id):
              try:
                  return (ms_meta if platform == "ms" else hf_meta)(repo_id), None
              except Exception as e:
                  return None, e

          src, err = meta("ms" if ms_to_hf else "hf", src_repo)
          if src is None:
              raise SystemExit(f"source listing failed on {src_name}: {err}")
          if not src:
              raise SystemExit(f"source repo {src_repo} listed 0 files - aborting")
          dst, err = meta("hf" if ms_to_hf else "ms", dst_repo)
          dst_listing_failed = err is not None

          def size_str(sz):
              if sz is None:
                  return "?"
              n = int(sz)
              if n >= 1024**3: return f"{n/1024**3:.2f} GB"
              if n >= 1024**2: return f"{n/1024**2:.1f} MB"
              if n >= 1024:    return f"{n/1024:.1f} KB"
              return f"{n} B"

          identical, changed, src_only, unverifiable = [], [], [], []
          for p, sm in sorted(src.items()):
              dm = dst.get(p) if dst else None
              if dm is None:
                  src_only.append(p); continue
              if sm["sha"] and dm["sha"]:
                  if sm["sha"] == dm["sha"]:
                      identical.append(p)
                  else:
                      changed.append((p, "sha256 不同"))
                  continue
              if sm["size"] is not None and dm["size"] is not None \
                 and int(sm["size"]) != int(dm["size"]):
                  changed.append((p, f"大小不同 {size_str(sm['size'])} → {size_str(dm['size'])}"))
                  continue
              sz = int(sm["size"] or dm["size"] or 0)
              if sz < 100 * 1024 * 1024:
                  unverifiable.append((p, "无 hash 可比对（小文件）"))
              else:
                  unverifiable.append((p, f"无 hash 可比对（{size_str(sz)}）"))

          dst_only = sorted(set(dst) - set(src)) if dst else []

          import html
          def cell(m, p):
              if not m:
                  return ""
              return f"<code>{html.escape(p)}</code><br><sub>{size_str(m.get('size'))}</sub>"

          CAP = 200  # rows per section in the rendered table
          def sec(rows_out, title, items):
              rows_out.append(f'<tr><td colspan="3"><b>{title}（{len(items)} 个）</b></td></tr>')
              for r in items[:CAP]:
                  rows_out.append(r)
              if len(items) > CAP:
                  rows_out.append(f'<tr><td colspan="3"><i>…另有 {len(items)-CAP} 个，见日志</i></td></tr>')

          tr = lambda *c: "<tr>" + "".join(f"<td>{x}</td>" for x in c) + "</tr>"
          R = []
          R.append(f"<h3>仓库差异对比</h3>")
          R.append(f"<p>源（{src_name}）<code>{src_repo}</code>：{len(src)} 个文件 ｜ "
                   f"目标（{dst_name}）<code>{dst_repo}</code>："
                   + ("列取失败" if dst_listing_failed else f"{len(dst)} 个文件") + "</p>")
          if dst_listing_failed:
              R.append(f"<p>⚠️ 目标仓列取失败（<code>{html.escape(str(err))}</code>），以下把目标视为空</p>")
          R.append("<table>")
          R.append("<tr><th>源</th><th>目标</th><th>结果</th></tr>")

          if src_only:
              sec(R, "🔴 只在源仓",
                  [tr(cell(src[p], p), "", "待传输") for p in src_only])
          if dst_only:
              sec(R, "🟣 只在目标仓",
                  [tr("", cell(dst[p], p), "mirror 会删") for p in dst_only])
          if changed:
              sec(R, "🔶 内容不同",
                  [tr(cell(src[p], p), cell(dst[p], p), why) for p, why in changed])
          if unverifiable:
              sec(R, "⚪ 无法比对",
                  [tr(cell(src[p], p), cell(dst[p], p), why) for p, why in unverifiable])
          if identical:
              sec(R, "✅ 一致",
                  [tr(cell(src[p], p), cell(dst[p], p), "sha256 相同") for p in identical])
          R.append("</table>")

          report = "\n".join(R)
          print(report)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as f:
                  f.write(report + "\n")
          PY
