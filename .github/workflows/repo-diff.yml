name: 仓库差异对比

on:
  workflow_dispatch:
    inputs:
      direction:
        description: '对比方向（决定 source/target 各在哪个平台）'
        required: true
        default: 'ModelScope → HuggingFace'
        type: choice
        options:
          - 'ModelScope → HuggingFace'
          - 'HuggingFace → ModelScope'
      source_repo:
        description: 'Source repo id (owner/name)'
        required: true
        default: 'terry2010/Huihui-Ornith-1.5-35B-A3B-oQ4e-mtp'
      target_repo:
        description: 'Target repo id (owner/name)'
        required: true
        default: 'terry2010/Ornith-1.5-35B-A3B-abliterated-MLX-oQ4e-mtp'
      repo_type:
        description: 'Repository type'
        required: true
        default: 'model'
        type: choice
        options:
          - model
          - dataset

concurrency:
  group: repo-diff-${{ inputs.source_repo }}-${{ inputs.target_repo }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install ms2hf
      # Read-only audit; see scripts/compare.py
      - name: Compare repositories
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          COMPARE_SRC_REPO: ${{ inputs.source_repo }}
          COMPARE_DST_REPO: ${{ inputs.target_repo }}
          COMPARE_REPO_TYPE: ${{ inputs.repo_type }}
          COMPARE_DIRECTION: ${{ inputs.direction }}
        run: python scripts/compare.py
